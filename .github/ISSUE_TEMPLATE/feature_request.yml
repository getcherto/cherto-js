name: Feature request
description: Suggest a change to an SDK.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Issues here are public, so leave out keys and anything that identifies your users.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem, and where the SDK gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Any workaround you use instead.
