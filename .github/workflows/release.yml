name: Release

# Runs only in the public repo, once for each `<package>@<version>` tag the
# staging repo's promote workflow pushes. `build` builds and tests the tag and
# runs the package checks on the tagged package's tarball, which it uploads;
# `stage` stages that tarball on npm through trusted publishing, with
# provenance. Nothing is public until a maintainer approves the staged version
# with 2FA.
#
# Only `stage` can mint an OIDC token, and it runs no dependency code, so a
# compromised dev dependency in `build` cannot stage a package.

on:
  push:
    tags: ["@cherto/node@*", "@cherto/browser@*", "@cherto/react@*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.repository == 'getcherto/cherto-js'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      tarball: ${{ steps.release.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # @cherto/<name>@<version> is the package in sdks/<name>.
      - name: Check the tag names a package and its version
        id: release
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^@cherto/([a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::cannot read a package and version from the tag $GITHUB_REF_NAME"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          actual=$(node -p "const p = require('./sdks/$name/package.json'); p.name + '@' + p.version" 2> /dev/null || true)
          if [ "$actual" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match sdks/$name/package.json (${actual:-missing})"
            exit 1
          fi
          {
            echo "package=@cherto/$name"
            echo "dir=sdks/$name"
            echo "tarball=cherto-$name-$version.tgz"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Check the package and keep its tarball
        env:
          DIR: ${{ steps.release.outputs.dir }}
        run: node scripts/check-package.mjs --dir "$DIR" --out "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release/${{ steps.release.outputs.tarball }}
          if-no-files-found: error

  stage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    env:
      NPM_VERSION: 11.21.0
      PACKAGE: ${{ needs.build.outputs.package }}
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball

      # npm stage publish needs npm 11.15.0 or later.
      - name: Install npm ${{ env.NPM_VERSION }}
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm --version

      # Trusted publishing can't create a package, so a maintainer creates each
      # one and adds its trusted publisher before its first release is tagged.
      - name: Check the package exists on npm
        run: |
          if ! npm view "$PACKAGE" name > /dev/null 2>&1; then
            echo "::error::$PACKAGE isn't on npm yet. Create it and add this workflow as its trusted publisher, then re-run this job."
            exit 1
          fi

      - name: Stage on npm
        run: |
          echo "integrity sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          npm stage publish "./$TARBALL" --provenance --access public
